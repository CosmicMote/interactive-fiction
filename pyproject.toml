[project]
name = "interactive-fiction"
version = "0.1.0"
description = "Locally-run co-written interactive fiction, one structured beat at a time."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
fiction = "fiction.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
