<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Interactive Fiction{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script>
    // After a turn renders, bring the player's latest input (and the new beat below it) into view.
    document.addEventListener("htmx:afterSwap", (e) => {
      if (e.detail.target.id !== "story-area") return;
      const lines = e.detail.target.querySelectorAll(".player-line");
      if (lines.length) lines[lines.length - 1].scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
</head>
{# data-tone is the hook for tone-based color schemes later: style.css keys colors off it. #}
<body data-tone="{% block tone %}{% endblock %}">
  <header class="site">
    <a href="/" class="home">Interactive Fiction</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
