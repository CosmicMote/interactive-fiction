<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Interactive Fiction{% endblock %}</title>
  <script>
    // Apply the saved theme before first paint. "system" (or nothing saved) follows the OS.
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script>
    // After a turn renders, bring the player's latest input (and the new beat below it) into view.
    document.addEventListener("htmx:afterSwap", (e) => {
      if (e.detail.target.id !== "story-area") return;
      const lines = e.detail.target.querySelectorAll(".player-line");
      if (lines.length) lines[lines.length - 1].scrollIntoView({ behavior: "smooth", block: "start" });
    });
  </script>
</head>
{# data-tone is the hook for tone-based color schemes later: style.css keys colors off it. #}
<body data-tone="{% block tone %}{% endblock %}">
  <header class="site">
    <a href="{{ base }}/" class="home">Interactive Fiction</a>
    <div class="theme-switch" role="group" aria-label="Color theme">
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="system">System</button>
      <button type="button" data-theme-choice="dark">Dark</button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    (() => {
      const buttons = document.querySelectorAll("[data-theme-choice]");
      const current = () => document.documentElement.dataset.theme || "system";
      const render = () => buttons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.themeChoice === current()));
      buttons.forEach((b) => b.addEventListener("click", () => {
        const choice = b.dataset.themeChoice;
        if (choice === "system") delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = choice;
        try { localStorage.setItem("theme", choice); } catch {}
        render();
      }));
      render();
    })();
  </script>
</body>
</html>
